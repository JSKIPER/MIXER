<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="chat.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <script defer src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.3.0/bundles/stomp.umd.min.js"></script>
    <script defer src="chat.js"></script>
    <title>Mixer</title>
</head>
<body>
<div class="messenger">

    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="search-input">
                <input type="text" id="searchInput" placeholder="Search">
            </div>
        </div>
        <ul class="chat-list" id="chat-list">
        </ul>
    </aside>

    <section class="chat-area hidden" id="chatArea">
        <div id="navbar" class="chat-navbar">
            <div id="navbar-avatar" class="avatar avatar--blue" >
                <span class="avatar-username">PS</span>
            </div>
            <div class="chat-meta">
                <span class="chat-name">Alex Adams</span>
            </div>
        </div>
        <div class="message-area">
            <ul class="messages" id="message-list">
            </ul>
        </div>
        <div class="composer">
            <div class="composer-input">
                <textarea id="messageInput" placeholder="Message" rows="1"></textarea>
                <button type="submit" class="submit" id="submitBtn">
                    <svg viewBox="0 0 24 24" fill="white"><path d="M2 21l21-9L2 3v7l15 2-15 2v7z"></path></svg>
                </button>
            </div>
        </div>
    </section>

</div>

</body>
</html>
